<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel de Trabajador</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sidebar" id="sidebar">
    <button class="close-btn" onclick="toggleSidebar()">✖</button>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="paqueteria.html">Paquetería</a></li>
      <li><a href="parqueaderos.html">Parqueaderos</a></li>
    </ul>
  </div>

  <div class="user-popup" id="userPopup">
    <div class="user-popup-content">
        <p><strong>Administrador:</strong> Josue Montiel</p>
        <p><strong>Email:</strong> administrador@correo.com</p>
      <button onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>

  <header class="top-bar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="logo-container">
      <img src="logo.png" alt="Logo" class="logo" />
      <p class="nombre-conjunto">Conjunto Azahar</p>
    </div>
    <div class="user-info" onclick="toggleUserPopup()">
      <span>ADMINISTRADOR</span>
      <div class="user-icon">👤</div>
    </div>
  </header>

  <div class="welcome">
    <h2>Bienvenido <strong>ADMINISTRADOR</strong></h2>
    <p>Selecciona para editar a los residentes.</p>
  </div>
  <div class="contenedor-formulario">
    <div class="form-box">
      <button class="btn-back" onclick="window.location.href='administacion_residentes.html'">🔙</button>
      <p></p>
      <h2>RESIDENTE</h2>
    
      <form onsubmit="mostrarMensaje(event)">
        <input type="text" placeholder="NOMBRE" required />
        <input type="text" placeholder="DOCUMENTO" required />
        <input type="text" placeholder="TELEFONO" required />
        <input type="email" placeholder="CORREO" required />
        <input type="text" placeholder="CONTACTO DE EMERGENCIA" required />
        <input type="text" placeholder="TORRE" required />
        <input type="text" placeholder="APARTAMENTO" required />

        <select required>
            <option value="">ROL EN EL CONJUNTO</option>
            <option value="P1">PROPIETARIO</option>
            <option value="P2">ARRENDATARIO</option>
            <option value="P3">FAMILIAR</option>
          </select>
        
          <p class="confirm-text">¿ESTÁS SEGURO DE CREAR A ESTE RESIDENTE?</p>
          <button type="button" class="btn-editar" onclick="window.location.href='asignacion_residentes.html'">Editar</button>
          
    
      <!-- 👇 Aquí el botón ya dentro de .form-box -->
      <div class="footer">
        <button class="btn-menu" onclick="window.location.href='parking.html'">Menú Principal</button>
      </div>
    </div>

  <script>
      function mostrarMensaje(event) {
      event.preventDefault();
      document.getElementById("mensaje").style.display = "block";
      }
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    function toggleUserPopup() {
      document.getElementById("userPopup").classList.toggle("active");
    }

    function cerrarSesion() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
