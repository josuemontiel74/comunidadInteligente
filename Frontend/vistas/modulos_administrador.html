<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel de Trabajador</title>
  <link rel="stylesheet" href="../style/style.css" />
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">

  <style>
    /* Estilo para que las imágenes dentro de las cards tengan el mismo tamaño */
    .card img {
      height: 200px; /* altura fija */
      width: 100%;
      object-fit: cover;
    }

    /* Cards más grandes */
    .card {
      min-height: 420px; /* altura mayor para hacer los cuadros más grandes */
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h5 {
      font-size: 1.4rem;
    }

    .card .btn {
      margin-top: 10px;
    }

    .sidebar {
      max-width: 220px;
    }
  </style>
</head>
<body>
  <div class="container-fluid p-0">
    <div class="row">
      <div class="sidebar col-md-2" id="sidebar">
        <button class="btn btn-light" onclick="toggleSidebar()">✖</button>
        <ul>
          <li><a href="../login/index.html">Inicio</a></li>
          <li><a href="paqueteria.html">Gestión de trabajadores</a></li>
          <li><a href="parqueaderos.html">Gestión de Notificaciones</a></li>
        </ul>
      </div>

      <div class="col-lg-12 col-md-10 bg-success">
        <div class="user-popup" id="userPopup">
          <div class="user-popup-content">
            <p><strong>Administrador:</strong> Josué Montiel</p>
            <p><strong>Email:</strong> Administrador@correo.com</p>
            <button class="btn btn-primary" onclick="cerrarSesion()">Cerrar sesión</button>
          </div>
        </div>

        <header class="top-bar bg-success d-flex justify-content-between align-items-center p-3">
          <button class="menu-btn" onclick="toggleSidebar()">☰</button>
          <div class="logo-container">
            <img src="../img/logo.png" alt="Logo" class="logo ico" />
            <p class="nombre-conjunto">Conjunto Azahar</p>
          </div>
          <div class="user-info" onclick="toggleUserPopup()">
            <div class="">👤 <span class="text-light">Perfil</span></div> 
          </div>
        </header>
      </div>
    </div>

    <div class="text-center mb-4">
      <h2 class="text-white fw-bold">Seleccione el módulo que desee gestionar</h2>
      <p class="text-white">Elija la opción de su preferencia</p>
    </div>

   <!-- Cards -->
<div class="container-md">
  <div class="row p-3 g-4 m-3 justify-content-center">
    
    <!-- Opción Áreas Comunes -->
    <div class="col-md-6 col-lg-5 mx-auto">
      <div class="card shadow text-center">
        <div class="m-2">
          <img src="../img/areas comunes.png" alt="Visitantes" class="rounded-4 img-fluid ico">
        </div>
        <h5 class="mb-3">Gestión de áreas comunes</h5>
        <div class="d-flex justify-content-center align-items-end">
          <button class="btn btn-success roles" onclick="window.location.href='../rolAdmi/areascomunes.php'">
            Ir <i class="fas fa-arrow-right ms-2"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Opción Paquetería -->
    <div class="col-md-6 col-lg-5 mx-auto">
      <div class="card shadow text-center">
        <div class="m-2">
          <img src="../img/residentes.jpg" alt="Residentes" class="rounded-4 img-fluid ico">
        </div>
        <h5 class="mb-3">Gestión de Residentes</h5>
        <div class="d-flex justify-content-center align-items-end">
          <button class="btn btn-success roles" onclick="window.location.href='../rolAdmi/administacion_residentes.html'">
            Ir <i class="fas fa-arrow-right ms-2"></i>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>


  <script>
    function mostrarMensaje(event) {
      event.preventDefault();
      document.getElementById("mensaje").style.display = "block";
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    function toggleUserPopup() {
      document.getElementById("userPopup").classList.toggle("active");
    }

    function cerrarSesion() {
      window.location.href = "../login/index.html";
    }
  </script>
</body>
</html>
